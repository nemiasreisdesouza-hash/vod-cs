services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vod}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vodsecret}
      POSTGRES_DB: ${POSTGRES_DB:-vodanalyst}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-vod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-vod}:${POSTGRES_PASSWORD:-vodsecret}@postgres:5432/${POSTGRES_DB:-vodanalyst}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-vod-demos}
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code
      - uploads:/tmp/vod_uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build: ./backend
    depends_on:
      - backend
      - redis
      - postgres
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-vod}:${POSTGRES_PASSWORD:-vodsecret}@postgres:5432/${POSTGRES_DB:-vodanalyst}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-vod-demos}
      MINIO_USER: ${MINIO_USER:-minioadmin}
      MINIO_PASSWORD: ${MINIO_PASSWORD:-minioadmin123}
    volumes:
      - ./backend:/code
      - uploads:/tmp/vod_uploads
    command: celery -A app.tasks.celery_app.celery_app worker --loglevel=info --concurrency=2

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ""
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
