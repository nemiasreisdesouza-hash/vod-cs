events {}
http {
  upstream frontend { server frontend:3000; }
  upstream backend { server backend:8000; }
  server {
    listen 80;
    client_max_body_size 600M;
    location / { proxy_pass http://frontend; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
    location /api/ { proxy_pass http://backend/api/; proxy_set_header Host $host; }
    location /docs { proxy_pass http://backend/docs; }
    location /openapi.json { proxy_pass http://backend/openapi.json; }
  }
}
